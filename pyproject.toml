[project]
name = "study-coach"
version = "0.2.0"
description = "AI Study Coach: a Streamlit study planner with Groq-generated schedules and SQLite session tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Saumya Tiwari" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Explicit list so results do not shift when ruff changes its defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
